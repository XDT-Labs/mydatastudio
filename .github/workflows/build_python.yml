name: Build Python Server

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_args: '-DGGML_METAL=on -DGGML_NATIVE=off'
          # Vulkan (GPU) on Windows and Linux; see install_vulkan_sdk.sh.
          - os: windows-latest
            cmake_args: '-DGGML_NATIVE=off -DGGML_VULKAN=on'
          # The oldest supported Ubuntu, so the binary runs on newer glibc too.
          - os: ubuntu-22.04
            cmake_args: '-DGGML_NATIVE=off -DGGML_VULKAN=on'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: '3.11'

    - name: Install Build Tools (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: sudo apt-get update -y && sudo apt-get install -y cmake ninja-build build-essential zip file

    - name: Install Build Tools (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake ninja

    - name: Install Vulkan SDK
      if: matrix.os != 'macos-latest'
      shell: bash
      run: .github/scripts/install_vulkan_sdk.sh

    # CMake and MSVC are on the image already; make may not be.
    - name: Install Build Tools (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: command -v make || choco install make -y --no-progress

    # CPU build; see build-python in the Makefile.
    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: make build-python
      env:
        CMAKE_ARGS: ${{ matrix.cmake_args }}

    # Linux installs CPU-only torch through the Makefile; see build-python there.
    - name: Build (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: make build-python
      env:
        CMAKE_ARGS: ${{ matrix.cmake_args }}

    - name: Install Python Dependencies
      if: matrix.os == 'macos-latest'
      working-directory: aiserver
      run: pdm install --dev
      env:
        FORCE_CMAKE: "1"
        CMAKE_ARGS: ${{ matrix.cmake_args }}

    - name: Build with PyInstaller
      if: matrix.os == 'macos-latest'
      working-directory: aiserver
      run: pdm run pyinstaller -y main.spec

    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: aiserver-macos
        path: aiserver/dist/aiserver

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: aiserver-windows
        path: client/app/aiserver-windows.zip

    - name: Upload Artifact (Linux)
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-artifact@v4
      with:
        name: aiserver-linux
        path: client/app/aiserver-linux.zip
