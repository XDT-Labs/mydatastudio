# TEST-ONLY Dovecot config for IMAP integration tests. Plaintext auth, no TLS,
# fake shared password. Never use outside localhost tests.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0

base_dir = /run/dovecot
state_dir = /run/dovecot
default_login_user = vmail
default_internal_user = vmail
default_internal_group = vmail
mail_uid = vmail
mail_gid = vmail
protocols = imap
listen = *
ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login
log_path = /dev/stderr

mail_driver = maildir
mail_home = /srv/mail/%{user}
mail_path = ~/Maildir

# Two fake users, one shared fake password. CONDSTORE/QRESYNC are built into
# the imap protocol in 2.4 and advertised after ENABLE; CONDSTORE is in CAPABILITY.
passdb static {
  passdb_static_password = testpass
  fields {
    user = %{user}
  }
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/mail/%{user}
  }
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  # Non-standard names carrying special-use flags: name-vs-flag mapping tests.
  mailbox "Sent Items" {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Papierkorb {
    special_use = \Trash
    auto = subscribe
  }
}
