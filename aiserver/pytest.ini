# Test configuration for pytest

[pytest]
pythonpath = src
# Both trees are collected so a bare `pytest` is the whole suite. The PST
# parser's tests live beside the module under src/ and were previously invisible
# to the default run; they add their own sys.path entry, so no PYTHONPATH needed.
testpaths = tests src/aichat/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers = 
    asyncio: marks tests as async
    unit: marks tests as unit tests
    integration: marks tests as integration tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function